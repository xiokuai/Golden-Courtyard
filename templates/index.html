<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chat</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

:root {
  --bg-primary: #1a1a2e;
  --bg-secondary: #16213e;
  --bg-tertiary: #0f3460;
  --bg-surface: rgba(255,255,255,0.03);
  --bg-hover: rgba(255,255,255,0.06);
  --bg-active: rgba(255,255,255,0.1);
  --accent: #7c3aed;
  --accent-hover: #6d28d9;
  --accent-light: rgba(124,58,237,0.15);
  --green: #10b981;
  --red: #ef4444;
  --text-primary: #f1f5f9;
  --text-secondary: #94a3b8;
  --text-muted: #64748b;
  --border: rgba(255,255,255,0.06);
  --shadow: 0 8px 32px rgba(0,0,0,0.3);
  --radius: 12px;
}

[data-theme="light"] {
  --bg-primary: #f0f0f5;
  --bg-secondary: #ffffff;
  --bg-tertiary: #e8e8f0;
  --bg-surface: rgba(0,0,0,0.03);
  --bg-hover: rgba(0,0,0,0.05);
  --bg-active: rgba(0,0,0,0.08);
  --accent: #7c3aed;
  --accent-hover: #6d28d9;
  --accent-light: rgba(124,58,237,0.12);
  --green: #10b981;
  --red: #ef4444;
  --text-primary: #1e293b;
  --text-secondary: #475569;
  --text-muted: #94a3b8;
  --border: rgba(0,0,0,0.08);
  --shadow: 0 8px 32px rgba(0,0,0,0.1);
}

* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
  background: var(--bg-primary);
  color: var(--text-primary);
  height: 100vh;
  display: flex;
  overflow: hidden;
}

/* 自定义滚动条 */
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.2); }

/* ===== 认证页面 ===== */
#auth-page {
  display: flex; justify-content: center; align-items: center;
  width: 100%; height: 100%;
  background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
  position: relative; overflow: hidden;
}
#auth-page::before {
  content: ''; position: absolute; width: 600px; height: 600px;
  background: radial-gradient(circle, rgba(124,58,237,0.2), transparent 70%);
  top: -200px; right: -100px; animation: float 8s ease-in-out infinite;
}
#auth-page::after {
  content: ''; position: absolute; width: 500px; height: 500px;
  background: radial-gradient(circle, rgba(16,185,129,0.12), transparent 70%);
  bottom: -200px; left: -100px; animation: float 10s ease-in-out infinite reverse;
}
@keyframes float {
  0%, 100% { transform: translate(0, 0) scale(1); }
  50% { transform: translate(30px, -30px) scale(1.1); }
}

.auth-box {
  background: rgba(22,33,62,0.8);
  backdrop-filter: blur(20px);
  padding: 40px; border-radius: 20px; width: 420px;
  border: 1px solid rgba(255,255,255,0.08);
  box-shadow: var(--shadow); z-index: 1;
  animation: slideUp 0.5s ease;
}
@keyframes slideUp {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}
.auth-box .logo {
  width: 56px; height: 56px; margin: 0 auto 20px;
  background: linear-gradient(135deg, var(--accent), #a78bfa);
  border-radius: 16px; display: flex; align-items: center; justify-content: center;
}
.auth-box .logo svg { width: 28px; height: 28px; fill: #fff; }
.auth-box h2 { margin-bottom: 8px; color: #fff; text-align: center; font-size: 22px; font-weight: 700; }
.auth-box .subtitle { text-align: center; color: var(--text-muted); font-size: 14px; margin-bottom: 28px; }
.auth-box label { display: block; font-size: 12px; font-weight: 600; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 6px; }
.auth-box input {
  width: 100%; padding: 12px 14px; margin-bottom: 18px;
  border: 1px solid var(--border); border-radius: 10px;
  background: rgba(0,0,0,0.25); color: var(--text-primary);
  font-size: 14px; font-family: inherit;
  transition: border-color 0.2s, box-shadow 0.2s;
}
.auth-box input:focus {
  outline: none; border-color: var(--accent);
  box-shadow: 0 0 0 3px var(--accent-light);
}
.auth-box input::placeholder { color: var(--text-muted); }
.auth-box button {
  width: 100%; padding: 12px; border: none; border-radius: 10px;
  background: linear-gradient(135deg, var(--accent), #6d28d9);
  color: #fff; font-size: 15px; font-weight: 600; cursor: pointer;
  font-family: inherit; transition: transform 0.15s, box-shadow 0.2s;
  margin-top: 4px;
}
.auth-box button:hover { transform: translateY(-1px); box-shadow: 0 4px 20px rgba(124,58,237,0.4); }
.auth-box button:active { transform: translateY(0); }
.auth-box .switch {
  text-align: center; color: var(--text-muted); font-size: 13px;
  cursor: pointer; margin-top: 20px; transition: color 0.2s;
}
.auth-box .switch span { color: var(--accent); font-weight: 500; }
.auth-box .switch:hover span { text-decoration: underline; }

/* ===== 主界面 ===== */
#app { display: none; width: 100%; height: 100%; }

/* 服务器栏 */
#server-bar {
  width: 72px; background: rgba(10,10,20,0.6);
  display: flex; flex-direction: column; align-items: center;
  padding: 12px 0; gap: 4px; overflow-y: auto;
  border-right: 1px solid var(--border);
}
.server-icon {
  width: 48px; height: 48px; border-radius: 24px;
  background: var(--bg-surface); display: flex; align-items: center; justify-content: center;
  cursor: pointer; font-size: 17px; font-weight: 600; color: var(--text-secondary);
  transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
  position: relative; flex-shrink: 0;
}
.server-icon::before {
  content: ''; position: absolute; left: -16px;
  width: 4px; height: 0; border-radius: 0 4px 4px 0;
  background: var(--text-primary); transition: height 0.25s;
}
.server-icon:hover { border-radius: 16px; background: var(--accent); color: #fff; }
.server-icon:hover::before { height: 20px; }
.server-icon.active { border-radius: 16px; background: var(--accent); color: #fff; }
.server-icon.active::before { height: 36px; }
.server-sep { width: 32px; height: 2px; background: var(--border); border-radius: 1px; margin: 4px 0; flex-shrink: 0; }
.server-icon.add { color: var(--green); background: var(--bg-surface); font-size: 22px; }
.server-icon.add:hover { background: var(--green); color: #fff; border-radius: 16px; }

/* 频道侧栏 */
#channel-sidebar {
  width: 248px; background: rgba(15,20,40,0.5);
  display: flex; flex-direction: column;
  border-right: 1px solid var(--border);
}
#channel-sidebar .header {
  padding: 16px 16px; font-weight: 700; font-size: 15px; color: #fff;
  border-bottom: 1px solid var(--border);
  display: flex; justify-content: space-between; align-items: center;
  letter-spacing: -0.2px;
}
.header-actions { display: flex; gap: 4px; }
.icon-btn {
  width: 32px; height: 32px; border-radius: 8px; border: none;
  background: transparent; color: var(--text-muted); cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: all 0.15s;
}
.icon-btn:hover { background: var(--bg-hover); color: var(--text-primary); }
.icon-btn svg { width: 18px; height: 18px; }

.section-label {
  padding: 18px 16px 6px; font-size: 11px; font-weight: 700;
  color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.8px;
  display: flex; justify-content: space-between; align-items: center;
}
.section-label .add-ch {
  width: 18px; height: 18px; border-radius: 4px; border: none;
  background: transparent; color: var(--text-muted); cursor: pointer;
  display: flex; align-items: center; justify-content: center; font-size: 16px;
  transition: color 0.15s;
}
.section-label .add-ch:hover { color: var(--text-primary); }

#channel-list { flex: 1; overflow-y: auto; padding: 0 8px 8px; }
.channel-item {
  padding: 8px 10px; border-radius: 8px; cursor: pointer;
  color: var(--text-muted); font-size: 14px; font-weight: 500;
  display: flex; align-items: center; gap: 8px;
  transition: all 0.12s; margin-bottom: 1px;
}
.channel-item svg { width: 18px; height: 18px; opacity: 0.5; flex-shrink: 0; }
.channel-item:hover { background: var(--bg-hover); color: var(--text-secondary); }
.channel-item:hover svg { opacity: 0.7; }
.channel-item.active { background: var(--bg-active); color: var(--text-primary); }
.channel-item.active svg { opacity: 1; }
.channel-badge { margin-left: auto; background: var(--accent); color: #fff; font-size: 11px; font-weight: 600; padding: 1px 6px; border-radius: 8px; min-width: 18px; text-align: center; }
.channel-item.unread { color: var(--text-primary); font-weight: 600; }

#user-bar {
  padding: 10px 12px; background: rgba(0,0,0,0.2);
  display: flex; align-items: center; gap: 10px; font-size: 13px;
  border-top: 1px solid var(--border);
}
.user-avatar-small {
  width: 32px; height: 32px; border-radius: 50%;
  background: linear-gradient(135deg, var(--accent), #a78bfa);
  display: flex; align-items: center; justify-content: center;
  font-weight: 600; font-size: 13px; position: relative;
}
.user-avatar-small .status-dot {
  position: absolute; bottom: -1px; right: -1px;
  width: 10px; height: 10px; border-radius: 50%;
  background: var(--green); border: 2px solid var(--bg-primary);
}
#user-bar .username { color: #fff; font-weight: 600; flex: 1; }
#user-bar .user-status { font-size: 11px; color: var(--text-muted); cursor: pointer; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 120px; }
#user-bar .user-status:hover { color: var(--text-secondary); }
.user-info { flex: 1; min-width: 0; display: flex; flex-direction: column; }

/* 主题设置面板 */
#theme-panel {
  display: none; position: fixed; bottom: 60px; left: 80px;
  background: var(--bg-secondary); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 16px; z-index: 1000;
  box-shadow: var(--shadow); min-width: 200px;
}
#theme-panel.show { display: block; }
#theme-panel h4 { font-size: 12px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 10px; }
.theme-toggle-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
.theme-toggle-row span { font-size: 13px; color: var(--text-secondary); }
.toggle-switch { width: 40px; height: 22px; background: var(--bg-tertiary); border-radius: 11px; cursor: pointer; position: relative; transition: background 0.2s; }
.toggle-switch.active { background: var(--accent); }
.toggle-switch::after { content: ''; position: absolute; width: 18px; height: 18px; background: #fff; border-radius: 50%; top: 2px; left: 2px; transition: transform 0.2s; }
.toggle-switch.active::after { transform: translateX(18px); }
.accent-colors { display: flex; gap: 8px; flex-wrap: wrap; }
.accent-dot { width: 28px; height: 28px; border-radius: 50%; cursor: pointer; border: 2px solid transparent; transition: border-color 0.2s, transform 0.15s; }
.accent-dot:hover { transform: scale(1.15); }
.accent-dot.active { border-color: var(--text-primary); }
[data-theme="light"] ::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.15); }
[data-theme="light"] ::-webkit-scrollbar-thumb:hover { background: rgba(0,0,0,0.25); }
[data-theme="light"] #auth-page { background: linear-gradient(135deg, #e0e7ff, #f0f0ff, #e8e0f0); }
[data-theme="light"] .auth-box { background: rgba(255,255,255,0.85); }

#user-bar button {
  background: none; border: none; color: var(--text-muted);
  cursor: pointer; font-size: 12px; font-family: inherit;
  padding: 4px 8px; border-radius: 6px; transition: all 0.15s;
}
#user-bar button:hover { background: var(--bg-hover); color: var(--text-secondary); }

/* ===== 主聊天区 ===== */
#main-area { flex: 1; display: flex; flex-direction: column; background: var(--bg-primary); }
#main-area .header {
  padding: 14px 20px; font-weight: 600; font-size: 15px;
  border-bottom: 1px solid var(--border); color: #fff;
  display: flex; align-items: center; gap: 10px;
  backdrop-filter: blur(10px); background: rgba(26,26,46,0.8);
}
.header-hash { color: var(--text-muted); font-size: 20px; font-weight: 400; }

/* 欢迎空状态 */
#welcome {
  flex: 1; display: flex; flex-direction: column;
  align-items: center; justify-content: center; gap: 12px;
  color: var(--text-muted);
}
#welcome .welcome-icon {
  width: 80px; height: 80px; border-radius: 50%;
  background: linear-gradient(135deg, var(--accent-light), rgba(16,185,129,0.1));
  display: flex; align-items: center; justify-content: center; margin-bottom: 8px;
}
#welcome .welcome-icon svg { width: 36px; height: 36px; fill: var(--accent); }
#welcome h3 { color: var(--text-primary); font-size: 20px; }
#welcome p { font-size: 14px; max-width: 360px; text-align: center; line-height: 1.6; }

/* 消息列表 */
#messages {
  flex: 1; overflow-y: auto; padding: 20px;
  display: none; flex-direction: column; gap: 2px;
}
.message {
  display: flex; gap: 14px; padding: 6px 8px; border-radius: 8px;
  transition: background 0.1s; animation: msgIn 0.2s ease;
}
@keyframes msgIn {
  from { opacity: 0; transform: translateY(6px); }
  to { opacity: 1; transform: translateY(0); }
}
.message:hover { background: var(--bg-surface); }
.msg-avatar {
  width: 40px; height: 40px; border-radius: 50%; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  font-weight: 700; font-size: 15px; color: #fff; overflow: hidden;
}
.msg-avatar img, .member-avatar img, .dm-item-avatar img, .user-avatar-small img {
  width: 100%; height: 100%; object-fit: cover; border-radius: 50%;
}
.msg-body { min-width: 0; flex: 1; }
.msg-name { font-weight: 600; color: var(--text-primary); font-size: 14px; }
.msg-time { font-weight: 400; color: var(--text-muted); font-size: 11px; margin-left: 8px; }
.msg-text { color: var(--text-secondary); font-size: 14px; margin-top: 3px; word-break: break-word; line-height: 1.5; }
.msg-text code { background: rgba(255,255,255,0.06); padding: 1px 5px; border-radius: 4px; font-family: 'Consolas','Monaco',monospace; font-size: 13px; }
.msg-text pre { background: rgba(0,0,0,0.3); padding: 10px 12px; border-radius: 8px; margin: 6px 0; overflow-x: auto; }
.msg-text pre code { background: none; padding: 0; font-size: 13px; }
.msg-text a { color: var(--accent); text-decoration: none; }
.msg-text a:hover { text-decoration: underline; }

/* 消息输入 */
#message-form { padding: 0 20px 20px; }
#message-form form {
  display: flex; align-items: center;
  background: rgba(255,255,255,0.04); border: 1px solid var(--border);
  border-radius: 14px; padding: 4px 6px 4px 16px;
  transition: border-color 0.2s, box-shadow 0.2s;
}
#message-form form:focus-within {
  border-color: rgba(124,58,237,0.4);
  box-shadow: 0 0 0 3px rgba(124,58,237,0.08);
}
#message-form input {
  flex: 1; background: none; border: none; color: var(--text-primary);
  padding: 10px 0; font-size: 14px; outline: none; font-family: inherit;
}
#message-form input::placeholder { color: var(--text-muted); }
#message-form button {
  background: linear-gradient(135deg, var(--accent), #6d28d9);
  border: none; color: #fff; width: 36px; height: 36px;
  border-radius: 10px; cursor: pointer; display: flex;
  align-items: center; justify-content: center;
  transition: transform 0.15s, box-shadow 0.15s; flex-shrink: 0;
}
#message-form button:hover { transform: scale(1.05); box-shadow: 0 2px 12px rgba(124,58,237,0.4); }
#message-form button svg { width: 18px; height: 18px; fill: #fff; }

/* ===== 弹窗 ===== */
.modal-overlay {
  display: none; position: fixed; inset: 0;
  background: rgba(0,0,0,0.6); backdrop-filter: blur(4px);
  justify-content: center; align-items: center; z-index: 100;
}
.modal-overlay.show { display: flex; }
.modal {
  background: var(--bg-secondary); padding: 28px;
  border-radius: 16px; width: 440px;
  border: 1px solid var(--border); box-shadow: var(--shadow);
  animation: modalIn 0.25s ease;
}
@keyframes modalIn {
  from { opacity: 0; transform: scale(0.95) translateY(10px); }
  to { opacity: 1; transform: scale(1) translateY(0); }
}
.modal h3 { margin-bottom: 6px; color: #fff; font-size: 18px; font-weight: 700; }
.modal-tabs { display: flex; gap: 0; margin-bottom: 14px; border-bottom: 1px solid var(--border); }
.modal-tab { flex: 1; padding: 8px 0; background: none; border: none; border-bottom: 2px solid transparent; color: var(--text-muted); font-size: 13px; font-family: inherit; cursor: pointer; transition: color 0.2s, border-color 0.2s; }
.modal-tab:hover { color: var(--text-secondary); }
.modal-tab.active { color: var(--text-primary); border-bottom-color: var(--accent); }
.modal .modal-desc { color: var(--text-muted); font-size: 13px; margin-bottom: 20px; }
.modal label { display: block; font-size: 12px; font-weight: 600; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 6px; }
.modal input {
  width: 100%; padding: 12px 14px; margin-bottom: 16px;
  border: 1px solid var(--border); border-radius: 10px;
  background: rgba(0,0,0,0.25); color: var(--text-primary);
  font-size: 14px; font-family: inherit; transition: border-color 0.2s, box-shadow 0.2s;
}
.modal input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-light); }
.modal .actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 4px; }
.modal button {
  padding: 10px 20px; border: none; border-radius: 10px;
  cursor: pointer; font-size: 14px; font-weight: 600; font-family: inherit;
  transition: all 0.15s;
}
.modal .btn-primary {
  background: linear-gradient(135deg, var(--accent), #6d28d9); color: #fff;
}
.modal .btn-primary:hover { box-shadow: 0 4px 16px rgba(124,58,237,0.35); transform: translateY(-1px); }
.modal .btn-cancel { background: rgba(255,255,255,0.06); color: var(--text-secondary); }
.modal .btn-cancel:hover { background: rgba(255,255,255,0.1); }
.invite-code {
  background: rgba(0,0,0,0.3); padding: 14px; border-radius: 10px;
  font-family: 'SF Mono', 'Fira Code', monospace; font-size: 18px;
  text-align: center; margin-bottom: 16px; color: var(--accent);
  user-select: all; letter-spacing: 2px; border: 1px dashed rgba(124,58,237,0.3);
}

/* toast 提示 */
.toast {
  position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
  background: var(--bg-secondary); border: 1px solid var(--border);
  padding: 10px 20px; border-radius: 10px; font-size: 14px;
  color: var(--text-primary); box-shadow: var(--shadow);
  animation: toastIn 0.3s ease, toastOut 0.3s ease 2.5s forwards;
  z-index: 200;
}
@keyframes toastIn { from { opacity: 0; transform: translateX(-50%) translateY(10px); } to { opacity: 1; transform: translateX(-50%) translateY(0); } }
@keyframes toastOut { to { opacity: 0; transform: translateX(-50%) translateY(10px); } }

/* ===== 右侧成员面板 ===== */
#member-panel {
  width: 240px; background: rgba(15,20,40,0.5);
  border-left: 1px solid var(--border);
  display: flex; flex-direction: column; overflow-y: auto;
}
#member-panel .panel-title {
  padding: 16px; font-size: 11px; font-weight: 700;
  color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.8px;
}
.member-item {
  display: flex; align-items: center; gap: 10px;
  padding: 6px 16px; border-radius: 6px; margin: 0 8px;
  cursor: default; transition: background 0.12s;
}
.member-item:hover { background: var(--bg-hover); }
.member-avatar {
  width: 32px; height: 32px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-weight: 700; font-size: 13px; color: #fff; position: relative; flex-shrink: 0;
}
.member-avatar .dot {
  position: absolute; bottom: -1px; right: -1px;
  width: 10px; height: 10px; border-radius: 50%;
  border: 2px solid var(--bg-primary);
}
.dot-online { background: var(--green); }
.dot-offline { background: var(--text-muted); }
.member-info { min-width: 0; }
.member-name { font-size: 13px; font-weight: 500; color: var(--text-secondary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.member-item.offline .member-name { color: var(--text-muted); }
.member-item.offline .member-avatar { opacity: 0.45; }
.member-role { font-size: 10px; color: var(--text-muted); }
.member-status { font-size: 10px; color: var(--text-secondary); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 120px; }

/* ===== 输入指示器 ===== */
#typing-indicator {
  padding: 0 20px; height: 24px; font-size: 12px;
  color: var(--text-muted); display: flex; align-items: center; gap: 6px;
}
.typing-dots { display: inline-flex; gap: 3px; }
.typing-dots span {
  width: 5px; height: 5px; border-radius: 50%; background: var(--text-muted);
  animation: blink 1.4s infinite both;
}
.typing-dots span:nth-child(2) { animation-delay: 0.2s; }
.typing-dots span:nth-child(3) { animation-delay: 0.4s; }
@keyframes blink { 0%,80%,100% { opacity: 0.3; } 40% { opacity: 1; } }

/* ===== 消息操作按钮 ===== */
.message { position: relative; }
.msg-actions {
  display: none; position: absolute; right: 8px; top: -12px;
  background: var(--bg-secondary); border: 1px solid var(--border);
  border-radius: 6px; overflow: hidden; box-shadow: var(--shadow);
}
.message:hover .msg-actions { display: flex; }
.msg-action-btn {
  background: none; border: none; color: var(--text-muted);
  padding: 4px 8px; cursor: pointer; font-size: 12px;
  transition: all 0.12s; font-family: inherit;
}
.msg-action-btn:hover { background: var(--bg-hover); color: var(--text-primary); }
.msg-action-btn.danger:hover { color: var(--red); }

/* 编辑中的消息 */
.msg-editing textarea {
  width: 100%; background: rgba(0,0,0,0.2); border: 1px solid var(--accent);
  border-radius: 8px; color: var(--text-primary); padding: 8px 10px;
  font-size: 14px; font-family: inherit; resize: none; outline: none;
  margin-top: 4px;
}
.msg-editing .edit-hint { font-size: 11px; color: var(--text-muted); margin-top: 4px; }
.msg-edited { font-size: 11px; color: var(--text-muted); margin-left: 4px; font-weight: 400; }
.msg-reply-preview { font-size: 12px; color: var(--text-muted); padding: 4px 8px; margin-bottom: 2px; border-left: 2px solid var(--accent); cursor: pointer; }
.msg-reply-preview:hover { color: var(--text-secondary); }
.msg-reply-preview .reply-author { color: var(--accent); font-weight: 600; margin-right: 4px; }
#reply-bar { display: none; align-items: center; padding: 8px 20px 0; gap: 8px; font-size: 13px; color: var(--text-secondary); }
#reply-bar.active { display: flex; }
#reply-bar .reply-close { background: none; border: none; color: var(--text-muted); cursor: pointer; font-size: 16px; padding: 2px 6px; border-radius: 4px; }
#reply-bar .reply-close:hover { background: var(--bg-hover); color: var(--text-primary); }

/* ===== 私信面板 ===== */
#dm-view { display: none; flex: 1; flex-direction: column; }
#dm-sidebar {
  display: none; width: 248px; background: rgba(15,20,40,0.5);
  flex-direction: column; border-right: 1px solid var(--border);
}
#dm-sidebar .header {
  padding: 16px; font-weight: 700; font-size: 15px; color: #fff;
  border-bottom: 1px solid var(--border);
}
#dm-search { margin: 8px; }
#dm-search input {
  width: 100%; padding: 8px 12px; border-radius: 8px;
  background: rgba(0,0,0,0.25); border: 1px solid var(--border);
  color: var(--text-primary); font-size: 13px; font-family: inherit; outline: none;
}
#dm-search input:focus { border-color: var(--accent); }
#dm-list { flex: 1; overflow-y: auto; padding: 4px 8px; }
.dm-item {
  display: flex; align-items: center; gap: 10px;
  padding: 8px 10px; border-radius: 8px; cursor: pointer;
  transition: background 0.12s; margin-bottom: 1px;
}
.dm-item:hover { background: var(--bg-hover); }
.dm-item.active { background: var(--bg-active); }
.dm-item-avatar {
  width: 36px; height: 36px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-weight: 700; font-size: 14px; color: #fff; flex-shrink: 0;
}
.dm-item-info { flex: 1; min-width: 0; }
.dm-item-name { font-size: 14px; font-weight: 500; color: var(--text-primary); }
.dm-item-preview { font-size: 12px; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.dm-badge {
  background: var(--red); color: #fff; font-size: 11px; font-weight: 700;
  padding: 1px 6px; border-radius: 10px; flex-shrink: 0;
}

/* 服务器栏DM按钮 */
.server-icon.dm-btn { background: var(--bg-surface); }
.server-icon.dm-btn:hover { background: var(--accent); }
.server-icon.dm-btn.active { background: var(--accent); }

/* 右键菜单 */
.ctx-menu {
  position: fixed; background: var(--bg-secondary); border: 1px solid var(--border);
  border-radius: 8px; padding: 4px; min-width: 160px; z-index: 300;
  box-shadow: var(--shadow); animation: modalIn 0.15s ease;
}
.ctx-menu-item {
  padding: 8px 12px; border-radius: 4px; font-size: 13px;
  cursor: pointer; color: var(--text-secondary); transition: all 0.1s;
}
.ctx-menu-item:hover { background: var(--accent); color: #fff; }
.ctx-menu-item.danger { color: var(--red); }
.ctx-menu-item.danger:hover { background: var(--red); color: #fff; }

/* 用户资料卡片 */
#profile-card {
  display: none; position: fixed; z-index: 1001;
  background: var(--bg-secondary); border: 1px solid var(--border);
  border-radius: var(--radius); box-shadow: var(--shadow);
  width: 280px; overflow: hidden;
}
#profile-card.show { display: block; }
.profile-banner { height: 60px; background: linear-gradient(135deg, var(--accent), var(--bg-tertiary)); }
.profile-body { padding: 0 16px 16px; position: relative; }
.profile-avatar {
  width: 64px; height: 64px; border-radius: 50%; margin-top: -32px;
  border: 4px solid var(--bg-secondary); overflow: hidden;
  display: flex; align-items: center; justify-content: center;
  font-size: 24px; font-weight: 700; color: #fff;
}
.profile-avatar img { width: 100%; height: 100%; object-fit: cover; }
.profile-name { font-size: 18px; font-weight: 700; margin-top: 8px; }
.profile-status-text { font-size: 12px; color: var(--text-secondary); margin-top: 2px; }
.profile-section { margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--border); }
.profile-section h5 { font-size: 11px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 4px; }
.profile-section p { font-size: 13px; color: var(--text-secondary); }
.profile-online-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 4px; vertical-align: middle; }

/* ===== 移动端响应式 ===== */
.mobile-toggle { display: none; }
.mobile-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 90; }
.mobile-overlay.show { display: block; }

@media (max-width: 768px) {
  #app { position: relative; }
  #server-bar { display: none; position: fixed; left: 0; top: 0; bottom: 0; z-index: 101; width: 72px; }
  #channel-sidebar { display: none; position: fixed; left: 72px; top: 0; bottom: 0; z-index: 100; width: 248px; }
  #dm-sidebar { position: fixed !important; left: 0; top: 0; bottom: 0; z-index: 100; width: 280px; }
  #member-panel { display: none; position: fixed; right: 0; top: 0; bottom: 0; z-index: 100; width: 240px; }
  #app.show-sidebar #server-bar,
  #app.show-sidebar #channel-sidebar { display: flex; }
  #app.show-members #member-panel { display: flex; }
  .mobile-toggle { display: flex; }
  #main-area .header, #dm-view .header { padding-left: 8px; }
}
</style>
</head>
<body>

<!-- 认证页面 -->
<div id="auth-page">
  <div class="auth-box">
    <div class="logo">
      <svg viewBox="0 0 24 24"><path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm0 14H5.17L4 17.17V4h16v12z"/><path d="M7 9h2v2H7zm4 0h2v2h-2zm4 0h2v2h-2z"/></svg>

    </div>
    <div id="welcome">

        <svg viewBox="0 0 24 24"><path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm0 14H5.17L4 17.17V4h16v12z"/><path d="M7 9h2v2H7zm4 0h2v2h-2zm4 0h2v2h-2z"/></svg>
      </div>

      <form onsubmit="sendDm(event)" style="display:flex;align-items:center;background:rgba(255,255,255,0.04);border:1px solid var(--border);border-radius:14px;padding:4px 6px 4px 16px;">
        <input id="dm-input" placeholder="发送私信..." autocomplete="off" style="flex:1;background:none;border:none;color:var(--text-primary);padding:10px 0;font-size:14px;outline:none;font-family:inherit;" />

<script>
const API = '/api';
const COLORS = ['#7c3aed','#2563eb','#db2777','#ea580c','#16a34a','#0891b2','#7c2d12','#4f46e5'];
let currentUser = null;
let currentServer = null;
let currentChannel = null;
let ws = null;
let isLogin = true;
let dmMode = false;
let currentDmUser = null;
let dmWs = null;
let typingTimer = null;
let typingUsers = {};
let onlineUserIds = new Set();
let channelUnreads = {};

const ACCENT_PRESETS = [
  { name: '紫色', color: '#7c3aed', hover: '#6d28d9' },
  { name: '蓝色', color: '#2563eb', hover: '#1d4ed8' },
  { name: '青色', color: '#0891b2', hover: '#0e7490' },
  { name: '绿色', color: '#10b981', hover: '#059669' },
  { name: '橙色', color: '#ea580c', hover: '#c2410c' },
  { name: '粉色', color: '#db2777', hover: '#be185d' },
];

function initTheme() {
  const theme = localStorage.getItem('chat-theme') || 'dark';
  const accent = localStorage.getItem('chat-accent') || '#7c3aed';
  if (theme === 'light') document.documentElement.setAttribute('data-theme', 'light');
  applyAccent(accent);
  renderAccentDots(accent);
  const sw = document.getElementById('theme-switch');
  if (sw && theme === 'light') sw.classList.add('active');
}

function toggleLightDark() {
  const sw = document.getElementById('theme-switch');
  const isLight = document.documentElement.getAttribute('data-theme') === 'light';
  if (isLight) {
    document.documentElement.removeAttribute('data-theme');
    sw.classList.remove('active');
    localStorage.setItem('chat-theme', 'dark');
  } else {
    document.documentElement.setAttribute('data-theme', 'light');
    sw.classList.add('active');
    localStorage.setItem('chat-theme', 'light');
  }
}

function applyAccent(color) {
  const preset = ACCENT_PRESETS.find(p => p.color === color);
  const hover = preset ? preset.hover : color;
  document.documentElement.style.setProperty('--accent', color);
  document.documentElement.style.setProperty('--accent-hover', hover);
  document.documentElement.style.setProperty('--accent-light', color + '26');
}

function selectAccent(color) {
  applyAccent(color);
  localStorage.setItem('chat-accent', color);
  renderAccentDots(color);
}

function renderAccentDots(activeColor) {
  const container = document.getElementById('accent-colors');
  if (!container) return;
  container.innerHTML = '';
  ACCENT_PRESETS.forEach(p => {
    const dot = document.createElement('div');
    dot.className = 'accent-dot' + (p.color === activeColor ? ' active' : '');
    dot.style.background = p.color;
    dot.title = p.name;
    dot.onclick = () => selectAccent(p.color);
    container.appendChild(dot);
  });
}

function toggleThemePanel() {
  const panel = document.getElementById('theme-panel');
  panel.classList.toggle('show');
}

// 点击面板外关闭
document.addEventListener('click', (e) => {
  const panel = document.getElementById('theme-panel');
  if (panel && panel.classList.contains('show') && !panel.contains(e.target) && !e.target.closest('[onclick*="toggleThemePanel"]')) {
    panel.classList.remove('show');
  }
});

initTheme();

function getCookie(name) {
  const v = document.cookie.match('(^|;)\\s*' + name + '\\s*=\\s*([^;]+)');
  return v ? v.pop() : '';
}
async function api(path, opts = {}) {
  const { headers, ...rest } = opts;
  const res = await fetch(API + path, {
    headers: { 'Content-Type': 'application/json', 'X-CSRFToken': getCookie('csrftoken'), ...headers },
    ...rest,
  });
  if (res.status === 204) return null;
  const data = await res.json();
  if (!res.ok) throw data;
  return data;
}
function toast(msg) {
  const el = document.createElement('div');
  el.className = 'toast'; el.textContent = msg;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 3000);
}

function avatarInner(user) {
  if (user.avatar) return `<img src="${esc(user.avatar)}" alt="">`;
  const c = colorFor(user.username);
  return `<span style="display:flex;align-items:center;justify-content:center;width:100%;height:100%;background:linear-gradient(135deg,${c},${colorFor(user.username+'2')})">${esc(user.username.charAt(0).toUpperCase())}</span>`;
}
function colorFor(name) {
  let h = 0;
  for (let i = 0; i < name.length; i++) h = name.charCodeAt(i) + ((h << 5) - h);
  return COLORS[Math.abs(h) % COLORS.length];
}
function esc(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML.replace(/'/g, '&#39;').replace(/"/g, '&quot;'); }

function renderMd(text) {
  // text is already HTML-escaped via esc()
  // Code blocks first (```...```)
  text = text.replace(/```([\s\S]*?)```/g, (_, code) => `<pre><code>${code}</code></pre>`);
  // Inline code
  text = text.replace(/`([^`]+)`/g, '<code>$1</code>');
  // Bold
  text = text.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  // Italic
  text = text.replace(/\*(.+?)\*/g, '<em>$1</em>');
  // Strikethrough
  text = text.replace(/~~(.+?)~~/g, '<del>$1</del>');
  // Links (already escaped, so match &quot; or plain)
  text = text.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
  // Auto-link URLs
  text = text.replace(/(^|[^"=])(https?:\/\/[^\s<]+)/g, '$1<a href="$2" target="_blank" rel="noopener">$2</a>');
  return text;
}

// ===== 认证 =====
function toggleAuth() {
  isLogin = !isLogin;
  document.getElementById('auth-title').textContent = isLogin ? '欢迎回来' : '创建账号';
  document.getElementById('auth-subtitle').textContent = isLogin ? '登录以继续你的对话' : '注册一个新账号开始聊天';
  document.getElementById('auth-btn').textContent = isLogin ? '登录' : '注册';
  document.getElementById('auth-switch-text').innerHTML = isLogin
    ? '没有账号？<span>立即注册</span>' : '已有账号？<span>立即登录</span>';
}
async function doAuth() {
  const username = document.getElementById('auth-username').value.trim();
  const password = document.getElementById('auth-password').value;
  if (!username || !password) return toast('请填写用户名和密码');
  try {
    currentUser = await api((isLogin ? '/login/' : '/register/'), { method: 'POST', body: JSON.stringify({ username, password }) });

let loadingMore = false;
let noMoreMessages = false;

async function loadMessages() {
  noMoreMessages = false;
  const msgs = await api(`/channels/${currentChannel.id}/messages/`);
  const container = document.getElementById('messages');
  container.innerHTML = '';
  msgs.forEach(m => appendMessage(m));
  container.scrollTop = container.scrollHeight;
  if (msgs.length < 50) noMoreMessages = true;
}

async function loadOlderMessages() {
  if (loadingMore || noMoreMessages || !currentChannel) return;
  const container = document.getElementById('messages');
  const firstMsg = container.querySelector('.message');
  if (!firstMsg) return;
  const beforeId = firstMsg.dataset.id;
  loadingMore = true;
  try {
    const msgs = await api(`/channels/${currentChannel.id}/messages/?before=${beforeId}`);
    if (msgs.length < 50) noMoreMessages = true;
    if (!msgs.length) return;
    const oldHeight = container.scrollHeight;
    msgs.reverse().forEach(m => {
      const div = buildMessageEl(m);
      container.insertBefore(div, container.firstChild);
    });
    container.scrollTop = container.scrollHeight - oldHeight;
  } finally { loadingMore = false; }
}

document.getElementById('messages').addEventListener('scroll', function() {
  if (this.scrollTop < 100) loadOlderMessages();
});

function buildMessageEl(m) {
  const div = document.createElement('div');
  div.className = 'message';
  div.dataset.id = m.id;
  const time = new Date(m.created_at).toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' });
  const edited = (m.updated_at && m.created_at && m.updated_at !== m.created_at) ? '<span class="msg-edited">(已编辑)</span>' : '';
  const c = colorFor(m.author.username);
  const isOwn = m.author.id === currentUser.id;
  const replyHtml = m.reply_to ? `<div class="msg-reply-preview" onclick="scrollToMsg(${m.reply_to.id})"><span class="reply-author">@${esc(m.reply_to.author.username)}</span>${esc((m.reply_to.content || '').substring(0, 60))}</div>` : '';
  const ownActions = isOwn ? `
    <button class="msg-action-btn" onclick="startEdit(${m.id}, this)">编辑</button>
    <button class="msg-action-btn danger" onclick="deleteMsg(${m.id})">删除</button>` : '';
  div.innerHTML = `
    ${replyHtml}
    <div style="display:flex;align-items:flex-start;gap:12px;">
      <div class="msg-avatar">${avatarInner(m.author)}</div>
      <div class="msg-body">
        <div class="msg-name" style="color:${c}">${esc(m.author.username)}<span class="msg-time">${time}</span></div>
        <div class="msg-text" id="msg-text-${m.id}">${renderMd(esc(m.content))}${edited}</div>
      </div>
      <div class="msg-actions">
        <button class="msg-action-btn" onclick="startReply(${m.id})">回复</button>${ownActions}
      </div>
    </div>`;
  return div;
}

function appendMessage(m) {
  const container = document.getElementById('messages');
  container.appendChild(buildMessageEl(m));
  container.scrollTop = container.scrollHeight;
}

function startEdit(msgId, btn) {
  const textEl = document.getElementById('msg-text-' + msgId);
  if (!textEl) return;
  const oldText = textEl.textContent;
  const msgEl = textEl.closest('.message');
  msgEl.classList.add('msg-editing');
  textEl.innerHTML = `<textarea rows="2">${esc(oldText)}</textarea><div class="edit-hint">Esc 取消 · Enter 保存</div>`;
  const ta = textEl.querySelector('textarea');
  ta.focus();
  ta.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') { textEl.textContent = oldText; msgEl.classList.remove('msg-editing'); }
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      const nv = ta.value.trim();
      if (nv && nv !== oldText && ws) {
        ws.send(JSON.stringify({ type: 'edit_message', message_id: msgId, content: nv }));
      }
      textEl.textContent = nv || oldText;
      msgEl.classList.remove('msg-editing');
    }
  });
}

function deleteMsg(msgId) {
  if (!ws) return;
  ws.send(JSON.stringify({ type: 'delete_message', message_id: msgId }));
}

let wsRetry = 0;
function connectWS() {
  if (ws) ws.close();
  wsRetry = 0;
  _doConnectWS();
}
function _doConnectWS() {
  const proto = location.protocol === 'https:' ? 'wss' : 'ws';
  ws = new WebSocket(`${proto}://${location.host}/ws/chat/${currentChannel.id}/`);
  ws.onopen = () => { wsRetry = 0; };
  ws.onmessage = (e) => {
    const data = JSON.parse(e.data);
    if (data.type === 'message' || !data.type) {
      appendMessage(data);
    } else if (data.type === 'typing') {
      showTyping(data.username);
    } else if (data.type === 'edit') {
      const el = document.getElementById('msg-text-' + data.id);
      if (el) el.innerHTML = renderMd(esc(data.content)) + '<span class="msg-edited">(已编辑)</span>';
    } else if (data.type === 'delete') {
      const msg = document.querySelector(`.message[data-id="${data.message_id}"]`);
      if (msg) { msg.style.animation = 'none'; msg.style.opacity = '0'; setTimeout(() => msg.remove(), 200); }
    } else if (data.type === 'presence') {
      if (data.status === 'online') onlineUserIds.add(data.user_id);
      else onlineUserIds.delete(data.user_id);
      renderMemberList();
    }
  };
  ws.onclose = () => {
    if (!currentChannel) return;
    const delay = Math.min(1000 * Math.pow(2, wsRetry), 30000);
    wsRetry++;
    setTimeout(_doConnectWS, delay);
  };
}

let replyingTo = null;

function startReply(msgId) {
  const msgEl = document.querySelector(`.message[data-id="${msgId}"]`);
  if (!msgEl) return;
  const author = msgEl.querySelector('.msg-name')?.textContent?.split(/\s/)[0] || '';
  const preview = msgEl.querySelector('.msg-text')?.textContent?.substring(0, 40) || '';
  replyingTo = msgId;
  document.getElementById('reply-info').textContent = `回复 @${author}: ${preview}`;
  document.getElementById('reply-bar').classList.add('active');
  document.getElementById('msg-input').focus();
}

function cancelReply() {
  replyingTo = null;
  document.getElementById('reply-bar').classList.remove('active');
}

function scrollToMsg(msgId) {
  const el = document.querySelector(`.message[data-id="${msgId}"]`);
  if (el) { el.scrollIntoView({ behavior: 'smooth', block: 'center' }); el.style.background = 'var(--accent-light)'; setTimeout(() => el.style.background = '', 1500); }
}

function sendMessage(e) {
  e.preventDefault();
  const input = document.getElementById('msg-input');
  const text = input.value.trim();
  if (!text || !ws) return;
  const payload = { type: 'message', content: text };
  if (replyingTo) { payload.reply_to = replyingTo; }
  ws.send(JSON.stringify(payload));
  input.value = '';
  cancelReply();
}

function getMyRole() {
  const ms = (window._memberships || []).find(m => m.user.id === currentUser.id);
  return ms ? ms.role : null;
}

function showMemberCtx(e, user, membership) {
  e.preventDefault();
  removeCtxMenu();
  const menu = document.createElement('div');
  menu.className = 'ctx-menu';
  menu.style.left = e.clientX + 'px';
  menu.style.top = e.clientY + 'px';

  // 发送私信
  const dmItem = document.createElement('div');
  dmItem.className = 'ctx-menu-item';
  dmItem.textContent = '发送私信';
  dmItem.onclick = () => startDmFromMember(user.id, user.username);
  menu.appendChild(dmItem);

  const myRole = getMyRole();
  const targetRole = membership.role;

  // 角色管理（仅 owner）
  if (myRole === 'owner' && targetRole !== 'owner') {
    const sep = document.createElement('div');
    sep.style.cssText = 'height:1px;background:var(--border);margin:4px 0;';
    menu.appendChild(sep);

    if (targetRole !== 'admin') {
      const setAdmin = document.createElement('div');
      setAdmin.className = 'ctx-menu-item';
      setAdmin.textContent = '设为管理员';
      setAdmin.onclick = () => changeRole(user.id, 'admin');
      menu.appendChild(setAdmin);
    }
    if (targetRole !== 'member') {
      const setMember = document.createElement('div');
      setMember.className = 'ctx-menu-item';
      setMember.textContent = '设为成员';
      setMember.onclick = () => changeRole(user.id, 'member');
      menu.appendChild(setMember);
    }
  }

  // 踢出（owner 可踢任何人，admin 可踢 member）
  if ((myRole === 'owner' && targetRole !== 'owner') ||
      (myRole === 'admin' && targetRole === 'member')) {
    const kickItem = document.createElement('div');
    kickItem.className = 'ctx-menu-item';
    kickItem.style.color = 'var(--red)';
    kickItem.textContent = '踢出服务器';
    kickItem.onclick = () => kickMember(user.id, user.username);
    menu.appendChild(kickItem);
  }

  document.body.appendChild(menu);
}

  removeCtxMenu();
  if (!currentServer) return;
  try {
    const data = await api(`/servers/${currentServer.id}/role/`, {
      method: 'POST',
      body: JSON.stringify({ user_id: userId, role }),
    });
    toast(data.detail || '角色已更新');

async function kickMember(userId, username) {
  removeCtxMenu();
  if (!currentServer) return;
  if (!confirm(`确定要将 ${username} 踢出服务器吗？`)) return;
  try {
    await api(`/servers/${currentServer.id}/kick/`, {
      method: 'POST',
      body: JSON.stringify({ user_id: userId }),
    });
    toast('已踢出该成员');
    loadMembers();
  } catch (e) { toast(e.detail || '操作失败'); }
}

function startDmFromMember(userId, username) {
  removeCtxMenu();
  showDmView();
  selectDmUser({ id: userId, username: username });
}

// ===== 私信功能 =====
async function loadDmConversations() {
  try {
    const convos = await api('/dm/');
    const list = document.getElementById('dm-list');
    list.innerHTML = '';
    convos.forEach(c => {
      const el = document.createElement('div');
      el.className = 'dm-item' + (currentDmUser && currentDmUser.id === c.user.id ? ' active' : '');
      const col = colorFor(c.user.username);
      el.innerHTML = `
        <div class="dm-item-avatar">${avatarInner(c.user)}</div>
        <div class="dm-item-info">
          <div class="dm-item-name">${esc(c.user.username)}</div>
          <div class="dm-item-preview">${esc(c.last_message)}</div>
        </div>
        ${c.unread > 0 ? `<div class="dm-badge">${c.unread}</div>` : ''}`;
      el.onclick = () => selectDmUser(c.user);
      list.appendChild(el);
    });
  } catch (e) { console.error(e); }
}

async function searchDmUser(query) {
  const list = document.getElementById('dm-list');
  if (!query.trim()) { loadDmConversations(); return; }
  try {
    const users = await api('/users/search/?q=' + encodeURIComponent(query));
    list.innerHTML = '';
    users.forEach(u => {
      const el = document.createElement('div');
      el.className = 'dm-item';
      const col = colorFor(u.username);
      el.innerHTML = `
        <div class="dm-item-avatar">${avatarInner(u)}</div>
        <div class="dm-item-info"><div class="dm-item-name">${esc(u.username)}</div></div>`;
      el.onclick = () => selectDmUser(u);
      list.appendChild(el);
    });
  } catch (e) { console.error(e); }
}

async function selectDmUser(user) {
  currentDmUser = user;
  document.getElementById('dm-header').innerHTML = `<span style="color:var(--text-muted);margin-right:8px;">@</span> ${esc(user.username)}`;
  document.getElementById('dm-input').placeholder = `发送给 @${user.username}...`;
  loadDmConversations();
  await loadDmMessages();
}

async function loadDmMessages() {
  if (!currentDmUser) return;
  try {
    const msgs = await api(`/dm/${currentDmUser.id}/`);
    const container = document.getElementById('dm-messages');
    container.innerHTML = '';
    msgs.forEach(m => {
      const div = document.createElement('div');
      div.className = 'message';
      const time = new Date(m.created_at).toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' });
      const c = colorFor(m.sender.username);
      div.innerHTML = `
        <div style="display:flex;align-items:flex-start;gap:12px;">
          <div class="msg-avatar">${avatarInner(m.sender)}</div>
          <div class="msg-body">
            <div class="msg-name" style="color:${c}">${esc(m.sender.username)}<span class="msg-time">${time}</span></div>
            <div class="msg-text">${renderMd(esc(m.content))}</div>
          </div>
        </div>`;
      container.appendChild(div);
    });
    container.scrollTop = container.scrollHeight;
  } catch (e) { console.error(e); }
}

async function sendDm(e) {
  e.preventDefault();
  const input = document.getElementById('dm-input');
  const text = input.value.trim();
  if (!text || !currentDmUser) return;
  if (dmWs && dmWs.readyState === 1) {
    dmWs.send(JSON.stringify({ type: 'message', receiver_id: currentDmUser.id, content: text }));
    input.value = '';
  } else {
    toast('连接已断开，请刷新页面');
  }
}

// ===== DM WebSocket =====
let dmWsRetry = 0;
function connectDmWs() {
  if (dmWs) dmWs.close();
  dmWsRetry = 0;
  _doConnectDmWs();
}
function _doConnectDmWs() {
  const proto = location.protocol === 'https:' ? 'wss' : 'ws';
  dmWs = new WebSocket(`${proto}://${location.host}/ws/dm/`);
  dmWs.onopen = () => { dmWsRetry = 0; };
  dmWs.onmessage = (e) => {
    const data = JSON.parse(e.data);
    if (data.type === 'dm') {
      handleDmMessage(data);
    }
  };
  dmWs.onclose = () => {
    if (!currentUser) return;
    const delay = Math.min(1000 * Math.pow(2, dmWsRetry), 30000);
    dmWsRetry++;
    setTimeout(_doConnectDmWs, delay);
  };
}

function handleDmMessage(data) {
  // 如果当前正在和这个人聊天，追加消息
  const partnerId = data.sender.id === currentUser.id ? data.receiver.id : data.sender.id;
  if (dmMode && currentDmUser && currentDmUser.id === partnerId) {
    appendDmMessage(data);
  }
  // 刷新会话列表
  if (dmMode) loadDmConversations();
}

function appendDmMessage(m) {
  const container = document.getElementById('dm-messages');
  const div = document.createElement('div');
  div.className = 'message';
  const time = new Date(m.created_at).toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' });
  const c = colorFor(m.sender.username);
  div.innerHTML = `
    <div style="display:flex;align-items:flex-start;gap:12px;">
      <div class="msg-avatar">${avatarInner(m.sender)}</div>
      <div class="msg-body">
        <div class="msg-name" style="color:${c}">${esc(m.sender.username)}<span class="msg-time">${time}</span></div>
        <div class="msg-text">${renderMd(esc(m.content))}</div>
      </div>
    </div>`;
  container.appendChild(div);
  container.scrollTop = container.scrollHeight;
}

// ===== 移动端面板切换 =====
function toggleMobileSidebar() {
  const app = document.getElementById('app');
  const show = !app.classList.contains('show-sidebar');
  app.classList.toggle('show-sidebar', show);
  app.classList.remove('show-members');
  document.getElementById('mobile-overlay').classList.toggle('show', show);
}

function toggleMobileMembers() {
  const app = document.getElementById('app');
  const show = !app.classList.contains('show-members');
  app.classList.toggle('show-members', show);
  app.classList.remove('show-sidebar');
  document.getElementById('mobile-overlay').classList.toggle('show', show);
}

function closeMobilePanels() {
  const app = document.getElementById('app');
  app.classList.remove('show-sidebar', 'show-members');
  document.getElementById('mobile-overlay').classList.remove('show');
}

// ===== 用户资料卡片 =====
function showProfileCard(e, user, membership) {
  const card = document.getElementById('profile-card');
  // 头像
  const av = document.getElementById('profile-avatar');
  if (user.avatar) {
    av.innerHTML = `<img src="${esc(user.avatar)}" alt="">`;
    av.style.background = 'none';
  } else {
    const c = colorFor(user.username);
    av.innerHTML = user.username.charAt(0).toUpperCase();
    av.style.background = `linear-gradient(135deg, ${c}, ${colorFor(user.username+'2')})`;
  }
  // banner 颜色
  document.getElementById('profile-banner').style.background =
    `linear-gradient(135deg, ${colorFor(user.username)}, var(--bg-tertiary))`;
  // 名称和状态
  document.getElementById('profile-name').textContent = user.username;
  const statusEl = document.getElementById('profile-status');
  statusEl.textContent = user.status_text || '';
  statusEl.style.display = user.status_text ? 'block' : 'none';
  // 角色
  const roleSection = document.getElementById('profile-role-section');
  if (membership) {
    roleSection.style.display = 'block';
    const roleMap = { owner: '所有者', admin: '管理员', member: '成员' };
    document.getElementById('profile-role').textContent = roleMap[membership.role] || membership.role;
  } else {
    roleSection.style.display = 'none';
  }
  // 在线状态
  const isOnline = onlineUserIds.has(user.id);
  const onlineEl = document.getElementById('profile-online');
  const dotColor = isOnline ? 'var(--green)' : 'var(--text-muted)';
  onlineEl.innerHTML = `<span class="profile-online-dot" style="background:${dotColor}"></span>${isOnline ? '在线' : '离线'}`;
  // 定位
  const rect = e.currentTarget.getBoundingClientRect();
  let left = rect.right + 10;
  let top = rect.top;
  if (left + 280 > window.innerWidth) left = rect.left - 290;
  if (top + 300 > window.innerHeight) top = window.innerHeight - 310;
  if (top < 10) top = 10;
  card.style.left = left + 'px';
  card.style.top = top + 'px';
  card.classList.add('show');
}

document.addEventListener('click', (e) => {
  const card = document.getElementById('profile-card');
  if (card && card.classList.contains('show') && !card.contains(e.target) && !e.target.closest('.member-item')) {
    card.classList.remove('show');
  }
});

// ===== 右键菜单 =====
function removeCtxMenu() {
  document.querySelectorAll('.ctx-menu').forEach(el => el.remove());
}

function showServerCtx(e, server) {
  e.preventDefault();
  removeCtxMenu();
  const menu = document.createElement('div');
  menu.className = 'ctx-menu';
  menu.style.left = e.clientX + 'px';
  menu.style.top = e.clientY + 'px';

  const inviteItem = document.createElement('div');
  inviteItem.className = 'ctx-menu-item';
  inviteItem.textContent = '邀请码';
  inviteItem.onclick = () => { removeCtxMenu(); showInviteFor(server.invite_code); };
  menu.appendChild(inviteItem);

  if (server.owner && server.owner.id === currentUser.id) {
    const iconItem = document.createElement('div');
    iconItem.className = 'ctx-menu-item';
    iconItem.textContent = '更换图标';
    iconItem.onclick = () => { removeCtxMenu(); pickServerIcon(server.id); };
    menu.appendChild(iconItem);
  }

  const actionItem = document.createElement('div');
  actionItem.className = 'ctx-menu-item danger';
  if (server.owner && server.owner.id === currentUser.id) {
    actionItem.textContent = '删除服务器';
    actionItem.onclick = () => { removeCtxMenu(); deleteServer(server.id); };
  } else {
    actionItem.textContent = '退出服务器';
    actionItem.onclick = () => { removeCtxMenu(); leaveServer(server.id); };
  }
  menu.appendChild(actionItem);
  document.body.appendChild(menu);
}

function showInviteFor(code) {
  document.getElementById('invite-code-display').textContent = code;
  document.getElementById('invite-modal').classList.add('show');
}

async function leaveServer(serverId) {
  if (!confirm('确定要退出该服务器吗？')) return;
  try {
    await api(`/servers/${serverId}/leave/`, { method: 'POST' });
    toast('已退出服务器');
    currentServer = null; currentChannel = null;
    if (ws) { ws.close(); ws = null; }
    document.getElementById('server-name').textContent = '选择服务器';
    document.getElementById('welcome').style.display = 'flex';
    document.getElementById('messages').style.display = 'none';
    document.getElementById('channel-list').innerHTML = '';
    document.getElementById('member-list').innerHTML = '';
    document.getElementById('invite-btn').style.display = 'none';
    loadServers();
  } catch (e) { toast(e.detail || '操作失败'); }
}

function pickServerIcon(serverId) {
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = 'image/*';
  input.onchange = () => uploadServerIcon(serverId, input.files[0]);
  input.click();
}

async function uploadServerIcon(serverId, file) {
  if (!file) return;
  if (file.size > 2 * 1024 * 1024) { toast('图片不能超过2MB'); return; }
  const fd = new FormData();
  fd.append('icon', file);
  try {
    const res = await fetch(API + `/servers/${serverId}/icon/`, {
      method: 'POST',
      headers: { 'X-CSRFToken': getCookie('csrftoken') },
      credentials: 'same-origin',
      body: fd,
    });
    const data = await res.json();
    if (res.ok) {
      if (currentServer && currentServer.id === serverId) currentServer = data;
      toast('图标已更新');
      loadServers();
    } else { toast(data.detail || '上传失败'); }
  } catch (e) { toast('上传失败'); }
}

async function deleteServer(serverId) {
  if (!confirm('确定要删除该服务器吗？此操作不可撤销！')) return;
  try {
    await api(`/servers/${serverId}/`, { method: 'DELETE' });
    toast('服务器已删除');
    currentServer = null; currentChannel = null;
    if (ws) { ws.close(); ws = null; }
    document.getElementById('server-name').textContent = '选择服务器';
    document.getElementById('welcome').style.display = 'flex';
    document.getElementById('messages').style.display = 'none';
    document.getElementById('channel-list').innerHTML = '';
    document.getElementById('member-list').innerHTML = '';
    document.getElementById('invite-btn').style.display = 'none';
    loadServers();
  } catch (e) { toast(e.detail || '删除失败'); }
}

// 点击任意位置关闭右键菜单
document.addEventListener('click', () => removeCtxMenu());

// 点击弹窗外部关闭
document.querySelectorAll('.modal-overlay').forEach(el => {
  el.addEventListener('click', (e) => {
    if (e.target === el) el.classList.remove('show');
  });
});

// 回车提交认证
document.getElementById('auth-password').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') doAuth();
});

// 启动
checkLogin();
